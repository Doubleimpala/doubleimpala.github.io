<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="ds/double-impala-design-system-d3e56450-a6f9-4d9f-a458-70f58b4d2fed/tokens/colors.css">
  <link rel="stylesheet" href="ds/double-impala-design-system-d3e56450-a6f9-4d9f-a458-70f58b4d2fed/tokens/typography.css">
  <link rel="stylesheet" href="ds/double-impala-design-system-d3e56450-a6f9-4d9f-a458-70f58b4d2fed/tokens/spacing.css">
  <link rel="stylesheet" href="ds/double-impala-design-system-d3e56450-a6f9-4d9f-a458-70f58b4d2fed/tokens/base.css">
  <link rel="stylesheet" href="ds/double-impala-design-system-d3e56450-a6f9-4d9f-a458-70f58b4d2fed/styles.css">
  <script src="ds/double-impala-design-system-d3e56450-a6f9-4d9f-a458-70f58b4d2fed/_ds_bundle.js"></script>
  <style>
    body { margin: 0; background: var(--purple-900); color: var(--text-primary); font-family: var(--font-body); }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); }
    .media-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--space-4);
    }
    .media-gallery figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .media-gallery a {
      display: block;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bg-surface);
    }
    .media-gallery img {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: contain;
      background: #000;
    }
    .media-gallery figcaption {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--text-muted);
    }
  </style>
</helmet>

<div style="min-height:100vh; display:flex; flex-direction:column;">

  <nav style="display:flex; align-items:center; justify-content:space-between; max-width:var(--container-max); width:100%; margin:0 auto; padding:var(--space-6) var(--space-8); box-sizing:border-box;">
    <a href="Home.dc.html" style="display:flex; align-items:baseline; gap:var(--space-3);">
      <span style="display:flex; align-items:center; gap:var(--space-2);">
        <img src="favicon.svg" alt="" aria-hidden="true" style="width:18px; height:18px; display:block;">
        <span style="font-family:var(--font-display); font-weight:var(--weight-semibold); font-size:var(--text-md); color:var(--text-primary); letter-spacing:var(--tracking-tight);">doubleimpala</span>
      </span>
      <span style="font-family:var(--font-mono); font-size:var(--text-xs); color:var(--text-muted);">Tanmay Garudadri</span>
    </a>
    <a href="Home.dc.html#projects" style="font-family:var(--font-display); font-size:var(--text-sm); color:var(--text-secondary);">&larr; projects</a>
  </nav>

  <main style="flex:1; max-width:var(--container-max); width:100%; margin:0 auto; padding:var(--space-8) var(--space-8) var(--space-24); box-sizing:border-box; display:flex; flex-direction:column; gap:var(--space-8);">

    <h1 style="font-family:var(--font-display); font-size:var(--text-3xl); font-weight:var(--weight-semibold); letter-spacing:var(--tracking-tight); margin:0;">A tiny GPU</h1>
    <p style="font-size:var(--text-base); line-height:var(--leading-relaxed); color:var(--text-muted); margin:0; max-width:60ch;">
      Renders textured 3D polygons, implemented in C and SystemVerilog on a Spartan 7 FPGA.
    </p>

    <div style="display:flex; gap:var(--space-6); font-family:var(--font-display); font-size:var(--text-sm);">
      <a href="https://github.com/Doubleimpala/3d-Polygonal-Graphics-Processor">repo &rarr;</a>
    </div>

    <video src="uploads/gpu/demo.mp4" controls playsinline style="width:100%; border:1px solid var(--border-default); border-radius:var(--radius-lg); background:#000;"></video>

    <div class="media-gallery">
      <figure>
        <a href="uploads/gpu/axi_bmp.png" target="_blank" rel="noopener noreferrer">
          <img src="uploads/gpu/axi_bmp.png" alt="Rasterized triangles read back over AXI">
        </a>
        <figcaption>Rasterized output (readback over AXI)</figcaption>
      </figure>
      <figure>
        <a href="uploads/gpu/sw_scene_1.png" target="_blank" rel="noopener noreferrer">
          <img src="uploads/gpu/sw_scene_1.png" alt="Software reference render, scene 1">
        </a>
        <figcaption>Software reference render 1</figcaption>
      </figure>
      <figure>
        <a href="uploads/gpu/sw_scene_2.png" target="_blank" rel="noopener noreferrer">
          <img src="uploads/gpu/sw_scene_2.png" alt="Software reference render, scene 2">
        </a>
        <figcaption>Software reference render 2</figcaption>
      </figure>
      <figure>
        <a href="uploads/gpu/sw_scene_3.png" target="_blank" rel="noopener noreferrer">
          <img src="uploads/gpu/sw_scene_3.png" alt="Software reference render, scene 3">
        </a>
        <figcaption>Software reference render 3</figcaption>
      </figure>
      <figure>
        <a href="uploads/gpu/state_diagram.png" target="_blank" rel="noopener noreferrer">
          <img src="uploads/gpu/state_diagram.png" alt="Rasterizer pipeline state diagram">
        </a>
        <figcaption>Rasterizer pipeline states</figcaption>
      </figure>
    </div>

    <div style="display:flex; flex-direction:column; gap:var(--space-3);">
      <span style="font-family:var(--font-mono); font-size:var(--text-xs); letter-spacing:var(--tracking-wider); text-transform:uppercase; color:var(--text-muted);">writeup</span>
      <iframe src="uploads/Documentation.pdf" style="width:100%; height:85vh; border:1px solid var(--border-default); border-radius:var(--radius-lg); background:var(--bg-surface);"></iframe>
    </div>

  </main>

</div>

</x-dc>
</body>
</html>
